[project]
name = "external-sandbox-container"
version = "0.1.2"
description = "Bring your own sandbox to coding agents: compatible shell and Codex execution APIs"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "Simon Willison", email = "swillison@gmail.com" }
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development",
]
dependencies = [
    "aiohttp>=3.12,<4",
    "cryptography>=45,<48",
    "h11>=0.16,<1",
]

[project.urls]
Homepage = "https://github.com/prime-radiant-inc/external-sandbox-container"
Repository = "https://github.com/prime-radiant-inc/external-sandbox-container"
Issues = "https://github.com/prime-radiant-inc/external-sandbox-container/issues"
Changelog = "https://github.com/prime-radiant-inc/external-sandbox-container/releases"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "websockets>=15", "ruff>=0.12"]

[project.scripts]
external-sandbox-container = "external_sandbox_container.cli:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: requires a real Apple Container or running server"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.uv.build-backend]
source-include = ["docs/**", "examples/**", "tests/**", "uv.lock", ".python-version", "PROVENANCE.md"]
wheel-exclude = ["src/external_sandbox_container/ui/test/**"]
