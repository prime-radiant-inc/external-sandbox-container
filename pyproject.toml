[project]
name = "sandbox-exec-server"
version = "0.1.0"
description = "Bring your own sandbox to coding agents: compatible shell and Codex execution APIs"
readme = "README.md"
authors = [
    { name = "Simon Willison", email = "swillison@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.12,<4",
    "cryptography>=45,<48",
    "h11>=0.16,<1",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "websockets>=15", "ruff>=0.12"]

[project.scripts]
sandbox-exec-server = "sandbox_exec_server.cli:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: requires a real Apple Container or running server"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.uv.build-backend]
source-include = ["clients/**", "docs/**", "examples/**", "tests/**", "uv.lock", ".python-version", "PROVENANCE.md"]
